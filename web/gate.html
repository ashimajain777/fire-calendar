<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Range-read gate</title></head>
<body><h1>Range-read gate</h1><pre id="out">running…</pre>
<script type="module">
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/+esm';
const out = document.getElementById('out');
const log = (o) => { out.textContent += '\n' + JSON.stringify(o); };
try {
  const bundles = duckdb.getJsDelivrBundles();
  const bundle = await duckdb.selectBundle(bundles);
  const workerUrl = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], {type: 'text/javascript'}));
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), new Worker(workerUrl));
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  const con = await db.connect();
  const cfg = await (await fetch('./config.json')).json();
  const targets = {
    pages_points_host: new URL(cfg.data.points + 'gate_test.parquet', location.href).href,
    release_direct: 'https://github.com/ashimajain777/fire-calendar/releases/download/data/gate_test.parquet',
  };
  for (const [name, url] of Object.entries(targets)) {
    const t0 = performance.now();
    try {
      const r = await con.query(`SELECT count(*)::INT AS n, min(acq_date)::VARCHAR AS d0 FROM read_parquet('${url}') WHERE latitude BETWEEN 30 AND 31`);
      log({name, ok: true, rows: r.toArray().map(x => x.toJSON()), ms: Math.round(performance.now() - t0)});
    } catch (e) { log({name, ok: false, error: String(e).slice(0, 300)}); }
  }
  window.__gateDone = true; log({done: true});
} catch (e) { log({fatal: String(e)}); window.__gateDone = true; }
</script></body></html>
